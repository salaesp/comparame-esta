    <title>Comparame esta</title>
    <meta name="description" content="Sacale fotos a tus tickets y mirá dónde está más barato cada producto, con los precios de tus amigos." />

    <meta name="apple-mobile-web-app-title" content="Comparame" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- El tema elegido en Ajustes se aplica antes de pintar (sin él, sigue al sistema). -->
    <script>
      try {
        var t = localStorage.getItem('cmp:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) { /* sin localStorage */ }
    </script>
    <link rel="stylesheet" href="/styles.css?v=0.2.1" />
    <link rel="stylesheet" href="/app.css?v=0.2.1" />
    <script src="/app.js?v=0.2.1" type="module" defer></script>
  </head>

    <div class="login-gate" id="login-gate" hidden></div>
    <div class="loadbar" id="loadbar" hidden aria-hidden="true"></div>
    <div class="offbar" id="offbar" hidden role="status"><span>Sin conexión</span><button type="button" class="offbar__btn" id="offbar-retry">Reintentar</button></div>

    <div class="shell" id="shell" hidden>
      <aside class="rail" id="rail" aria-label="Navegación">
        <div class="rail__top"><div class="rail__logo" aria-hidden="true"></div></div>
        <button type="button" class="rail__fab" data-nuevo aria-label="Cargar un ticket"><span data-ic="camera"></span><span class="rail__fablbl">Cargar ticket</span></button>
        <nav class="rail__nav" id="rail-nav"></nav>
        <button type="button" class="avatar-btn rail__avatar" data-goto="ajustes" aria-label="Ajustes"></button>
      </aside>
      <main class="stage" id="stage">
        <div class="mhead" id="mhead">
          <div class="mhead__title"><span class="mhead__txt" id="mhead-title">Comparame esta</span></div>
          <div class="mhead__acts">
            <button type="button" class="mhead__search" data-buscar aria-label="Buscar un producto"><span data-ic="search"></span></button>
            <button type="button" class="avatar-btn mhead__ava" data-goto="ajustes" aria-label="Ajustes"></button>
          </div>
        </div>
        <div class="topbar"><div class="topbar__row"><h1 class="topbar__title" id="topbar-title">Inicio</h1></div></div>
        <section class="view" id="view-inicio" hidden></section>
        <section class="view" id="view-productos" hidden></section>
        <section class="view" id="view-lugares" hidden></section>
        <section class="view" id="view-ajustes" hidden></section>
      </main>
    </div>
    <div class="tabguard" id="tabguard" hidden></div>
    <nav class="tabbar" id="tabbar" aria-label="Pantallas" hidden></nav>
    <button type="button" class="fab" id="fab" data-nuevo aria-label="Cargar un ticket" hidden><span data-ic="camera"></span></button>

    <div class="modal" id="modal" hidden>
      <div class="modal__scrim" data-close></div>
      <section class="modal__panel" id="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
    </div>
    <!-- Las fotos del ticket: la cámara (capture) y la galería (varias). -->
    <input type="file" id="foto-cam" accept="image/*" capture="environment" hidden />
    <input type="file" id="foto-gal" accept="image/*" multiple hidden />
  </body>
</html>
